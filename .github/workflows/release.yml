name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release Dual-Version NocoBase Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: packages/plugins/@nocobase/plugin-file-previewer-kkfileview

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Root package.json
        run: |
          cat << 'EOF' > package.json
          {
            "name": "nocobase-build-env",
            "private": true,
            "workspaces": [
              "packages/*/*",
              "packages/*/*/*"
            ],
            "scripts": {
              "nocobase": "nocobase-v1"
            },
            "dependencies": {
              "@nocobase/app": "2.2.0-beta.15",
              "@nocobase/cli": "2.2.0-beta.15",
              "@nocobase/build": "2.2.0-beta.15",
              "@nocobase/devtools": "2.2.0-beta.15"
            },
            "resolutions": {
              "cytoscape": "3.28.0",
              "@types/react": "18.3.18",
              "@types/react-dom": "^18.0.0",
              "react-router-dom": "^6.30.1",
              "react-router": "^6.30.1",
              "antd": "5.24.2",
              "async": "^3.2.6",
              "rollup": "4.24.0",
              "semver": "^7.7.1"
            }
          }
          EOF

      - name: Generate Configuration Files
        run: |
          cat << 'EOF' > lerna.json
          {
            "version": "0.1.0",
            "npmClient": "yarn",
            "useWorkspaces": true
          }
          EOF
          cat << 'EOF' > tsconfig.json
          {
            "extends": "./tsconfig.paths.json",
            "compilerOptions": {
              "esModuleInterop": true,
              "moduleResolution": "node",
              "jsx": "react",
              "target": "esnext",
              "module": "esnext",
              "allowJs": true,
              "noUnusedLocals": false,
              "preserveConstEnums": true,
              "skipLibCheck": true,
              "sourceMap": true,
              "inlineSources": true,
              "resolveJsonModule": true,
              "declaration": true,
              "experimentalDecorators": true,
              "downlevelIteration": true,
              "baseUrl": "."
            },
            "exclude": [
              "node_modules",
              "**/dist",
              "**/lib",
              "**/*.js",
              "**/*.d.ts"
            ]
          }
          EOF
          cat << 'EOF' > tsconfig.paths.json
          {
            "compilerOptions": {
              "paths": {
                "@nocobase/plugin-file-previewer-kkfileview/client": [
                  "packages/plugins/@nocobase/plugin-file-previewer-kkfileview/src/client"
                ],
                "@nocobase/plugin-file-previewer-kkfileview/client-v2": [
                  "packages/plugins/@nocobase/plugin-file-previewer-kkfileview/src/client-v2"
                ],
                "@nocobase/plugin-file-previewer-kkfileview/package.json": [
                  "packages/plugins/@nocobase/plugin-file-previewer-kkfileview/package.json"
                ],
                "@nocobase/plugin-file-previewer-kkfileview": [
                  "packages/plugins/@nocobase/plugin-file-previewer-kkfileview/src"
                ]
              }
            }
          }
          EOF

      - name: Create Env Files
        run: |
          touch .env
          touch .env.example
          touch .env.e2e.example
          touch .env.test.example

      - name: Cache Yarn Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-file-previewer-${{ hashFiles('**/yarn.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-file-previewer-
            ${{ runner.os }}-yarn-

      - name: Install Dependencies with Retry
        run: |
          yarn config set network-timeout 600000
          yarn config set registry https://registry.npmjs.org/
          
          n=0
          until [ "$n" -ge 4 ]
          do
            echo "Running yarn install (attempt $((n+1)))..."
            yarn install --network-timeout 600000 && break
            n=$((n+1))
            if [ "$n" -lt 4 ]; then
              echo "yarn install failed due to network/registry glitch, retrying in 5 seconds..."
              sleep 5
            else
              echo "ERROR: yarn install failed after 4 attempts."
              exit 1
            fi
          done

      - name: Get Plugin Version
        id: plugin_version
        run: |
          VERSION=$(node -p "require('./packages/plugins/@nocobase/plugin-file-previewer-kkfileview/package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          mkdir -p /tmp/release-artifacts

      - name: Build & Package Light Version (轻量版 - 无内置静态资产)
        run: |
          BUILD_FULL=false yarn nocobase build @nocobase/plugin-file-previewer-kkfileview
          
          cd packages/plugins/@nocobase/plugin-file-previewer-kkfileview
          
          echo "=== Verifying Light Build Artifacts ==="
          test -f "server.js" || { echo "ERROR: server.js is missing!"; exit 1; }
          test -f "client.js" || { echo "ERROR: client.js is missing!"; exit 1; }
          test -f "client-v2.js" || { echo "ERROR: client-v2.js is missing!"; exit 1; }
          test -d "dist" || { echo "ERROR: dist directory not found!"; exit 1; }
          test -f "dist/server/index.js" || { echo "ERROR: dist/server/index.js is missing!"; exit 1; }
          test -f "dist/client/index.js" || { echo "ERROR: dist/client/index.js is missing!"; exit 1; }
          test -f "dist/client-v2/index.js" || { echo "ERROR: dist/client-v2/index.js is missing!"; exit 1; }
          test -d "dist/locale" || { echo "ERROR: dist/locale directory not found!"; exit 1; }
          
          # 清理本地可能存在的静态资产以确保轻量
          rm -rf public/file-viewer
          
          echo "=== Packaging Light Version Files ==="
          ls -la
          
          # 显式白名单打包轻量版（保留 dist 产物、运行时入口、说明与许可，彻底隔离源码与无关开发文件）
          tar -czvf "/tmp/release-artifacts/plugin-file-previewer-kkfileview-v${RELEASE_VERSION}.tgz" \
            package.json README.md README_EN.md LICENSE server.js server.d.ts client.js client.d.ts client-v2.js client-v2.d.ts dist
            
          zip -r "/tmp/release-artifacts/plugin-file-previewer-kkfileview-v${RELEASE_VERSION}.zip" \
            package.json README.md README_EN.md LICENSE server.js server.d.ts client.js client.d.ts client-v2.js client-v2.d.ts dist

      - name: Build & Package Full Version (完整版 - 内置 File Viewer 离线资产)
        run: |
          cd packages/plugins/@nocobase/plugin-file-previewer-kkfileview
          
          # 修改 package.json 的版本号，添加 -full 后缀
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${RELEASE_VERSION}-full';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2), 'utf8');
          "
          
          # 回到工作区根目录执行完整构建（BUILD_FULL=true 会自动触发 build.config.js 的 copyToTargets）
          cd ../../../..
          BUILD_FULL=true yarn nocobase build @nocobase/plugin-file-previewer-kkfileview
          
          # 进入插件子目录进行校验与打包
          cd packages/plugins/@nocobase/plugin-file-previewer-kkfileview
          
          echo "=== Verifying Full Build Artifacts ==="
          test -f "server.js" || { echo "ERROR: server.js is missing!"; exit 1; }
          test -f "client.js" || { echo "ERROR: client.js is missing!"; exit 1; }
          test -f "client-v2.js" || { echo "ERROR: client-v2.js is missing!"; exit 1; }
          test -d "dist" || { echo "ERROR: dist directory not found!"; exit 1; }
          test -f "dist/server/index.js" || { echo "ERROR: dist/server/index.js is missing!"; exit 1; }
          test -f "dist/client/index.js" || { echo "ERROR: dist/client/index.js is missing!"; exit 1; }
          test -f "dist/client-v2/index.js" || { echo "ERROR: dist/client-v2/index.js is missing!"; exit 1; }
          test -d "public/file-viewer" || { echo "ERROR: public/file-viewer is missing in full build!"; exit 1; }
          test -f "public/file-viewer/flyfish-file-viewer-web-full.iife.js" || { echo "ERROR: File Viewer offline bundle is missing!"; exit 1; }
          
          echo "=== Packaging Full Version Files ==="
          ls -la
          
          # 显式白名单打包完整版（包含 public 内置离线静态资产）
          tar -czvf "/tmp/release-artifacts/plugin-file-previewer-kkfileview-v${RELEASE_VERSION}-full.tgz" \
            package.json README.md README_EN.md LICENSE server.js server.d.ts client.js client.d.ts client-v2.js client-v2.d.ts dist public
            
          zip -r "/tmp/release-artifacts/plugin-file-previewer-kkfileview-v${RELEASE_VERSION}-full.zip" \
            package.json README.md README_EN.md LICENSE server.js server.d.ts client.js client.d.ts client-v2.js client-v2.d.ts dist public
            
          # 还原 package.json 版本号并清理本地临时资产
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${RELEASE_VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2), 'utf8');
          "
          rm -rf public/file-viewer

      - name: Generate Checksums
        run: |
          cd /tmp/release-artifacts
          sha256sum plugin-file-previewer-kkfileview-v*.tgz plugin-file-previewer-kkfileview-v*.zip > sha256sums.txt
          echo "=== Generated SHA256 Checksums ==="
          cat sha256sums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-file-previewer-kkfileview-v${{ steps.plugin_version.outputs.version }}
          path: |
            /tmp/release-artifacts/plugin-file-previewer-kkfileview-v*.tgz
            /tmp/release-artifacts/plugin-file-previewer-kkfileview-v*.zip
            /tmp/release-artifacts/sha256sums.txt
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.plugin_version.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Release v{0}', steps.plugin_version.outputs.version) }}
          draft: false
          prerelease: ${{ contains(steps.plugin_version.outputs.version, 'beta') || contains(steps.plugin_version.outputs.version, 'alpha') || contains(steps.plugin_version.outputs.version, 'rc') }}
          generate_release_notes: true
          files: |
            /tmp/release-artifacts/plugin-file-previewer-kkfileview-v*.tgz
            /tmp/release-artifacts/plugin-file-previewer-kkfileview-v*.zip
            /tmp/release-artifacts/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
